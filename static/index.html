<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4fb8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="التخليص" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>منصة إدارة التخليص الجمركي</title>
    <meta name="description" content="نظام ERP ونقطة بيع وتتبع شحنات لمكاتب التخليص الجمركي" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      window.process = window.process || { env: {} };
      try{var t=localStorage.getItem('theme')||'system',d=document.documentElement;var dark=t==='dark'||t==='royal'||t==='blueprint'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);if(dark)d.classList.add('dark');if(t==='royal'||t==='blueprint')d.dataset.theme=t;}catch(e){}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>هذا النظام يحتاج JavaScript.</noscript>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
